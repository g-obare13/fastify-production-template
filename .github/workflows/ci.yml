name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Drift Check, Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastify_template_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:RELEASE.2024-01-18T22-51-28Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting & linting
        run: pnpm lint

      - name: Check Root-Anchored Imports
        run: pnpm lint:imports

      - name: Check JSDoc Documentation
        run: pnpm lint:docs

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify Codegen Drift (contracts, types, env)
        run: |
          pnpm gen:all
          git diff --exit-code

      - name: Run unit & integration tests with coverage
        run: pnpm test:cov
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastify_template_db
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: super_secret_access_jwt_key_that_is_at_least_32_chars_long
          JWT_REFRESH_SECRET: super_secret_refresh_jwt_key_that_is_at_least_32_chars_long
          COOKIE_SECRET: super_secret_cookie_signing_key_that_is_at_least_32_chars_long
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: fastify-uploads
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"

      - name: Build Application
        run: pnpm build

      - name: Build SDK Package
        run: pnpm build:sdk

      - name: Verify Docker build
        run: docker build -t fastify-backend-template:ci .
